<div class="message-box" role="alert" *ngIf="visible">
    <i class="message-icon ri-error-warning-fill"></i>

    <div class="message-body">
        <span class="message-title">Warning</span>
        <span class="message-text">{{ message }}</span>
    </div>

    <button type="button" class="message-dismiss" aria-label="Dismiss warning" (click)="dismiss()">
        <i class="ri-close-line"></i>
    </button>
</div>
