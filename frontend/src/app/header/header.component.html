<header class="js-header pt1">
    <div class="conn" [class.online]="connected">
        <span class="conn-dot"></span>
        <span class="conn-text">VC-4 {{ connected ? 'Connected' : 'Disconnected' }}</span>
    </div>
    <div class="header">
        <span>{{ mode }}</span>
        <div class="room-layout" *ngIf="page === 1">
            <div class="row">
                <div class="col">
                    <div ngbDropdown class="d-inline-block">
                        <button type="button" class="btn btn-outline-primary" id="dropdownBasic1" ngbDropdownToggle>
                            Room Layout
                        </button>
                        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
                            <button ngbDropdownItem (click)="separate()">Rooms Separate</button>
                            <div class="dropdown-divider"></div>
                            <button ngbDropdownItem (click)="combine()">Rooms Combine</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
