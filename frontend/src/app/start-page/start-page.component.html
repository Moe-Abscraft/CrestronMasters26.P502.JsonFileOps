<main class="js-main presentation">
    <div class="room-body">

    <!-- Mic level: left edge -->
    <aside class="audio-side">
        <app-audio-controls channel="mic"></app-audio-controls>
    </aside>

    <div class="room-content">

        <!-- Sources -->
        <section class="group">
            <h2 class="group-title">Sources</h2>

            <div class="js-dashboard-content-container sources">
                <!-- No selected-state feedback: a source button only shows the press itself -->
                <button type="button" class="btn src" *ngFor="let source of visibleSources; trackBy: trackByIndex"
                    (click)="sourceSet(source)">
                    <img [src]="iconFor(source)" [alt]="source.icon" class="icon-connected">
                    <span class="src-name">{{ source.name }}</span>
                </button>
            </div>

            <p class="empty-note" *ngIf="visibleSources.length === 0">
                Waiting for the room configuration&hellip;
            </p>
        </section>

        <!-- Displays -->
        <section class="group" *ngIf="visibleDisplays.length > 0">
            <h2 class="group-title">Displays</h2>

            <div class="js-dashboard-content-container displays">
                <!-- Tap a display to route the selected source to it -->
                <div class="disp" role="button" tabindex="0"
                     *ngFor="let display of visibleDisplays; trackBy: trackByIndex"
                     (click)="displaySelect(display)">
                    <div class="disp-head">
                        <img [src]="displayIcon" alt="display" class="icon-connected">
                        <div class="disp-title">
                            <span class="disp-name">{{ display.name }}</span>
                            <span class="disp-model" *ngIf="display.model.length > 0">{{ display.model }}</span>
                        </div>
                    </div>

                    <div class="disp-routed" [class.idle]="display.routedSource.length === 0">
                        {{ display.routedSource || 'Nothing routed' }}
                    </div>

                    <!-- Only there when something is routed; sends Displays.Display[i].Clear -->
                    <button type="button" class="disp-clear" aria-label="Clear display"
                            *ngIf="display.routedSource.length > 0"
                            (click)="displayClear(display, $event)">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- Program level: right edge -->
    <aside class="audio-side">
        <app-audio-controls channel="program"></app-audio-controls>
    </aside>

    </div>

    <!-- Presets: pinned to the bottom, just above the footer -->
    <section class="presets-bar">
        <app-presets></app-presets>
    </section>

    <div class="container-fluid footer-container">
        <div class="footer-row">
            <div class="js-dashboard-footer-text">
                <span>Crestron Masters 2026 | P501</span>
            </div>

            <!-- Reload Config / Auto Update / Last updated -->
            <app-config-status></app-config-status>

            <div class="js-dashboard-footer-brand footer-brand">
                <span>Crestron Electronics</span>
            </div>
        </div>
    </div>
</main>
