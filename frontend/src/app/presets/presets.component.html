<div class="presets">
    <button type="button" class="preset"
            *ngFor="let index of presets; trackBy: trackByIndex"
            [class.holding]="holding === index"
            [class.saved]="saved === index"
            (pointerdown)="onPress(index, $event)"
            (pointerup)="onRelease(index)"
            (pointerleave)="onCancel()"
            (pointercancel)="onCancel()"
            (contextmenu)="$event.preventDefault()">

        <span class="hold-sweep"></span>

        <span class="preset-face">
            <fa-icon class="preset-icon" [icon]="icons.preset"></fa-icon>
            <span class="preset-name">{{ label(index) }}</span>
        </span>

        <span class="preset-saved">
            <fa-icon [icon]="icons.check"></fa-icon>
            Saved
        </span>
    </button>
</div>

<p class="preset-hint">Tap to recall &middot; hold {{ holdSeconds }} seconds to save</p>
